name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile + unit test
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :third_party:brouter:build

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  tile-schema:
    name: Tile schema verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download planetiler
        run: |
          mkdir -p tools/bin
          curl -fsSL -o tools/bin/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
          echo "sha256  tools/bin/planetiler.jar" | sha256sum --check --strict

      - name: Verify Astra tile schema
        run: java -jar tools/bin/planetiler.jar verify schemas/astra_schema.yml
