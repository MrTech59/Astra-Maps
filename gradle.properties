# Astra Maps - Gradle properties.
#
# Toolchain: Gradle 8.13, AGP 8.12.0, Kotlin 2.2.10, JDK 21 (Android Studio JBR).

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
